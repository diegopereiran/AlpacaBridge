dependencies:
  # ZWO ships 4 independently-versioned product SDKs (Camera, EAF focuser,
  # EFW filter wheel, CAA rotator/climate) from one WordPress-backed JSON
  # endpoint (acf.software_downloads[], matched by software_download_title).
  # Tracked as 4 separate dependencies since they release independently --
  # see check_updates.py's wordpress-acf provider.
  - id: zwo-asi-camera-sdk
    kind: vendor-sdk
    relationship: direct
    scan_path: AlpacaCore/external/ZWO/ASI_Camera_SDK
    local:
      version_from:
        type: filename
        glob: "AlpacaCore/external/ZWO/ASI_Camera_SDK/lib/linux/armv8/libASICamera2.so.*"
        regex: 'libASICamera2\.so\.(.+)$'
    drift:
      - file: debian/rules
        must_contain:
          - "AlpacaCore/external/ZWO/ASI_Camera_SDK/lib/linux/armv8"
    current: {note: "version resolved at scan time from the installed SONAME"}
    usage: {build: true, runtime: true, packaged: true}
    updates:
      provider: wordpress-acf
      endpoint: "https://www.zwoastro.com/wp-json/wp/v2/zwo_software?slug=product-sdk"
      collection: "0.acf.software_downloads"
      match: {software_download_title: "ASI Camera SDK"}
      version_field: software_version
      release_date_field: software_release_date
      size_field: software_file_size
      download_url_field: software_download_url
      release_notes_field: software_update_log_url
      verify_download: true
      expect_library_glob: "*armv8*libASICamera2.so*"

  - id: zwo-eaf-sdk
    kind: vendor-sdk
    relationship: direct
    scan_path: AlpacaCore/external/ZWO/EAF
    local:
      version_from:
        type: filename
        glob: "AlpacaCore/external/ZWO/EAF/lib/armv8/libEAFFocuser.so.*"
        regex: 'libEAFFocuser\.so\.(.+)$'
    drift:
      - file: debian/rules
        must_contain:
          - "AlpacaCore/external/ZWO/EAF/lib/eaf.rules"
    current: {note: "version resolved at scan time from the installed SONAME"}
    usage: {build: true, runtime: true, packaged: false}
    updates:
      provider: wordpress-acf
      endpoint: "https://www.zwoastro.com/wp-json/wp/v2/zwo_software?slug=product-sdk"
      collection: "0.acf.software_downloads"
      match: {software_download_title: "EAF SDK"}
      version_field: software_version
      release_date_field: software_release_date
      size_field: software_file_size
      download_url_field: software_download_url
      release_notes_field: software_update_log_url
      verify_download: true
      expect_library_glob: "*armv8*libEAFFocuser.so*"

  - id: zwo-efw-sdk
