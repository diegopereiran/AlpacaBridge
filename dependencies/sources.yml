  # Player One ships the camera and filter wheel SDKs as separate downloads
  # that version independently (same shape as ZWO above). Their software
  # page (player-one-astronomy.com/service/software) shows each product's
  # version, but it's injected client-side by JS (confirmed: the raw HTTP
  # response -- what this script's urllib actually fetches -- contains the
  # "Camera SDK" label but not the version number next to it), so it can't
  # be regex-scraped the way ZWO's or libgpiod's static pages can.
  #
  # playerone-camera-sdk also covers iOptron's iCAM cameras: iCAM178M/462C/
  # 464C enumerate as USB VID a0a0 with a "Player One iCAM..." descriptor
  # string and are recognized by the Player One SDK with no special
  # handling (.github/instructions/ioptron.instructions.md, 2026-08-26).
  # iOptron publishes no camera SDK of its own -- there is deliberately no
  # separate ioptron-camera-sdk entry here; that would be a fictional
  # dependency.
  - id: playerone-camera-sdk
    kind: vendor-sdk
    relationship: direct
    scan_path: AlpacaCore/external/PlayerOne/PlayerOne_Camera_SDK_Linux_V3.10.0
    local:
      version_from:
        type: filename
        glob: "AlpacaCore/external/PlayerOne/PlayerOne_Camera_SDK_Linux_V3.10.0/lib/arm64/libPlayerOneCamera.so.*"
        regex: '\.so\.(\d+\.\d+\.\d+)$'
    drift:
      - file: debian/rules
        must_contain:
          - "AlpacaCore/external/PlayerOne/PlayerOne_Camera_SDK_Linux_V3.10.0/lib/arm64"
    current: {note: "version resolved at scan time from the installed SONAME"}
    usage: {build: true, runtime: true, packaged: true}
    updates:
      provider: manual
      reason: >-
        Page renders SDK versions client-side via JS; no static source
        found. Check https://www.player-one-astronomy.com/service/software
        by hand.

  - id: playerone-filterwheel-sdk
