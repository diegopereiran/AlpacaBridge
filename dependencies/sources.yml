  - id: qhy-sdk
    kind: vendor-sdk
    relationship: direct
    scan_path: AlpacaCore/external/QHY
    drift:
      - file: debian/rules
        must_contain:
          - "AlpacaCore/external/QHY/sdk_linux_arm64_26.06.04"
    current:
      version: "26.06.04"
      path: AlpacaCore/external/QHY/sdk_linux_arm64_26.06.04
    usage: {build: true, runtime: true, packaged: true}
    updates:
      # log_en.html is a docsify shell rendered client-side (no static
      # content); the actual changelog is the markdown source it fetches.
      provider: vendor-page
      url: https://www.qhyccd.com/html/prepub/log_en.md
      version_pattern: 'sdk_linux_arm64_(\d+\.\d+\.\d+)\.tar\.gz'

  - id: touptek-sdk
    kind: vendor-sdk
    relationship: direct
    scan_path: AlpacaCore/external/ToupTek
    drift:
      - file: debian/rules
        must_contain:
          - "AlpacaCore/external/ToupTek/toupcamsdk.20260128/linux/arm64/glibc"
    current:
      version: "20260128"
      path: AlpacaCore/external/ToupTek/toupcamsdk.20260128
    usage: {build: true, runtime: true, packaged: true}
    updates:
      # No reachable machine-readable source found: touptek.com/download/...
      # 404s, and both www.touptekphotonics.com/download/ and
      # www.touptek-astro.com/downloads/ render their SDK list client-side
      # (no static filename/version text to regex against).
      provider: manual
      reason: >-
        No static, machine-readable SDK version source found. Check
        https://www.touptek-astro.com/downloads/ (Developers > Linux) by hand.

  - id: svbony-sdk
    kind: vendor-sdk
    relationship: direct
    scan_path: AlpacaCore/external/SVBONY
    drift:
      - file: debian/rules
        must_contain:
          - "AlpacaCore/external/SVBONY/lib/armv8"
    current:
      version: unknown
      path: AlpacaCore/external/SVBONY
      note: >-
        No version in the filename or SONAME; tracked via readme.txt's last
        changelog entry cross-checked against the string embedded in the
        .so itself (classify_svbony flags LOCAL_VERSION_MISMATCH if they
        disagree).
    usage: {build: true, runtime: true, packaged: true}
    updates:
      provider: svbony
      url: https://www.svbony.com/downloads/software-driver
      readme_path: AlpacaCore/external/SVBONY/readme.txt
      so_path: AlpacaCore/external/SVBONY/lib/armv8/libSVBCameraSDK.so

  # Player One ships the camera and filter wheel SDKs as separate downloads
  # that version independently (same shape as ZWO above). Their software
  # page (player-one-astronomy.com/service/software) shows each product's
  # version, but it's injected client-side by JS (confirmed: the raw HTTP
  # response -- what this script's urllib actually fetches -- contains the
  # "Camera SDK" label but not the version number next to it), so it can't
  # be regex-scraped the way ZWO's or libgpiod's static pages can.
  - id: playerone-camera-sdk
    kind: vendor-sdk
    relationship: direct
    scan_path: AlpacaCore/external/PlayerOne/PlayerOne_Camera_SDK_Linux_V3.10.0
    local:
      version_from:
        type: filename
        glob: "AlpacaCore/external/PlayerOne/PlayerOne_Camera_SDK_Linux_V3.10.0/lib/arm64/libPlayerOneCamera.so.*"
        regex: '\.so\.(\d+\.\d+\.\d+)$'
    drift:
      - file: debian/rules
        must_contain:
          - "AlpacaCore/external/PlayerOne/PlayerOne_Camera_SDK_Linux_V3.10.0/lib/arm64"
    current: {note: "version resolved at scan time from the installed SONAME"}
    usage: {build: true, runtime: true, packaged: true}
    updates:
      provider: manual
      reason: >-
        Page renders SDK versions client-side via JS; no static source
        found. Check https://www.player-one-astronomy.com/service/software
        by hand.

  - id: playerone-filterwheel-sdk
    kind: vendor-sdk
    relationship: direct
    scan_path: AlpacaCore/external/PlayerOne/PlayerOne_FilterWheel_SDK_Linux_V1.2.3
    local:
      version_from:
        type: filename
        glob: "AlpacaCore/external/PlayerOne/PlayerOne_FilterWheel_SDK_Linux_V1.2.3/lib/arm64/libPlayerOnePW.so.*"
        regex: '\.so\.(\d+\.\d+\.\d+)$'
    drift:
