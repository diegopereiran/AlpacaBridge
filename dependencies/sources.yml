  # precompiled .so and having no vendor-published checksum/signature to
  # verify the download against. These do not change per version, so they
  # are baselined once per vendor rather than re-approved every release.
  - component: zwo-asi-camera-sdk
    code: precompiled-binary
    rationale: "ZWO ships prebuilt .so libraries; no source is published."
    approved: "2026-09-18"
    review_after: "2027-03-18"
