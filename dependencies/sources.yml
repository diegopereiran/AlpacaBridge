# Human-maintained dependency provenance and update rules.
#
# scripts/dependencies/map_dependencies.py reads this file, cross-checks it
# against the repository (CMakeLists.txt, debian/rules, ci.yml, build
# scripts), and regenerates dependencies/inventory.json.
# scripts/dependencies/check_updates.py reads the generated inventory and
# this file's `updates` blocks to check each dependency against its upstream
# source. See dependencies/README.md for the model this file implements.
#
# `kind` values:
#   vendor-sdk        - a vendored camera/mount/filter-wheel SDK tree. Treated
#                        as ONE component for update purposes (it usually ships
#                        as a single upstream bundle) but recursively scanned
#                        file-by-file for risk (see `scan_path`).
#   vendored-source    - upstream source vendored and built in-tree (libgpiod).
#   cmake-dependency   - a library resolved via CMake find_package/FetchContent.
#   test-dependency    - a dependency used only by the test suite.
#   ci-tool            - a tool downloaded by CI, not shipped in the package.
#   system-package     - a Debian package this repo build-depends or
#                         run-depends on (see debian/control).
#   managed-elsewhere  - tracked here for visibility only; updates are handled
#                         by another system (Dependabot for GitHub Actions).
#
# `updates.provider` values map to scripts/dependencies/sources/*.py:
#   release-page, github-release, vendor-page, debian, manual

