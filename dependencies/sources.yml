  - id: github-actions
    kind: managed-elsewhere
    relationship: indirect
    current:
      path: .github/workflows/
    updates:
      provider: manual
      reason: >-
        Handled by Dependabot (.github/dependabot.yml). This system does not
        open competing update PRs for pinned Actions; it only tracks
        pin/comment consistency across workflow files (see
        map_dependencies.py's checkout-annotation check).

  # Sky-Watcher publishes 4 documents on its Application Development page:
  # Motor Controller Command Set, SynScan Serial Communication Protocol,
  # SynScan App Protocol, and a SynScanLink API library (iOS-only binary).
  # Only the first two are implemented here (drivers `skywatcher` and
  # `synscan` speak these wire protocols directly; neither links against a
  # Sky-Watcher SDK or library) -- the App protocol and the iOS-only library
  # are out of scope and intentionally untracked.
  #
  # kind: external-specification -- a protocol-spec document, not a build
  # dependency. The repo stores a Markdown conversion of the upstream PDF
  # (AGENTS.md/docs convention), so the local file's hash can never be
  # compared directly to the PDF's; update-state.json instead tracks the
  # last-seen upstream PDF's own sha256, to catch a silent replacement of
  # the PDF under the same URL/date.
  - id: skywatcher-motor-controller-protocol
    kind: external-specification
    relationship: indirect
    current:
      path: AlpacaCore/external/SynScan/SkyWatcher_Motor_Controller_Command_Set.md
    usage: {build: false, runtime: false, packaged: false}
    updates:
      provider: static-download-page
      page: https://skywatcher.com/download/manual/application-development/
      title: "Manual: Sky-Watcher Motor Controller Command Set"
      verify_download: true

  - id: synscan-serial-protocol
    kind: external-specification
    relationship: indirect
    current:
      version: "3.3"
      path: AlpacaCore/external/SynScan/synscanserialcommunicationprotocol_version33.md
    usage: {build: false, runtime: false, packaged: false}
    updates:
      provider: static-download-page
      page: https://skywatcher.com/download/manual/application-development/
      title: "Manual: Synscan Serial Communication Protocol, Version 3.3"
      verify_download: true

  # iOptron publishes no general SDK. Its mount protocol IS a real,
  # versioned, directly-downloadable spec PDF (unlike Sky-Watcher's listing
  # page above, iOptron serves it at a stable URL with real HTTP caching
  # headers -- verified live: Content-Type application/pdf, Content-Length
  # 211630, ETag "7678f16d6c1d71:0", Last-Modified 2021-02-12). iEAF/iEFW
  # have no vendor SDK OR published spec at all -- AlpacaBridge implements
  # their serial protocol directly from INDI's open-source reference
  # drivers, so those are tracked as advisory source references instead
  # (kind: externally-derived-protocol), not as a spec to diff bytes
  # against. iMate PowerBox uses Linux GPIO via libgpiod (already tracked
  # above); iCAM is covered by playerone-camera-sdk (see its comment).
  - id: ioptron-mount-rs232-protocol
    kind: external-specification
    relationship: indirect
    current:
      version: "3.10"
      path: AlpacaCore/external/iOptron/RS-232_Command_Language2014V310.md
    usage: {build: false, runtime: false, packaged: false}
    updates:
      provider: direct-document
      url: https://www.ioptron.com/v/ASCOM/RS-232_Command_Language2014V310.pdf
      verify_download: true

  # Advisory only -- see classify_github_source_reference() in
  # check_updates.py. reviewed_commit is the INDI commit this driver's
  # protocol implementation was last checked against; bump it by hand
  # after reviewing a flagged change, the same way acknowledged_risks
  # entries are bumped after a human decision.
  - id: ioptron-ieaf-protocol
    kind: externally-derived-protocol
