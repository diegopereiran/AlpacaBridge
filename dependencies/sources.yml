    review_after: "2027-03-18"
  - component: svbony-sdk
    code: nested-third-party-component
    rationale: >-
      SVBONY bundles its own libusb shared library alongside the Debian
      libusb dependency AlpacaBridge itself build-depends on. Tracked as a
      separate instance, not a defect.
    approved: "2026-09-18"
    review_after: "2027-03-18"

