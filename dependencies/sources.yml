  # `packages` names the Debian SOURCE package (sources.debian.org's /api/src/<name>/
  # unit) that provides each debian/control build/runtime dependency, not the
  # binary/-dev package name -- they often differ (libgpiod-dev comes from
  # source package "libgpiod", libudev-dev from "systemd", etc.).
  - id: debian-build-deps
    kind: system-package
    relationship: direct
    current:
      path: debian/control
      # g++ (compiler) and adduser (basic system account tool) are
      # intentionally excluded -- toolchain/trivial, not meaningfully
      # trackable "versions" the way a library or build tool is.
      packages:
        - cmake
        - debhelper
        - pkgconf
        - libgpiod
        - nlohmann-json3
        - hidapi
        - libusb-1.0
        - systemd
        - libgphoto2
        - libraw
        - curl
        - zlib
    usage: {build: true, runtime: false, packaged: false}
    updates:
      provider: debian
      release: trixie

  - id: debian-runtime-deps
    kind: system-package
    relationship: direct
    current:
      path: debian/control
