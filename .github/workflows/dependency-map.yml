name: Dependency map

on:
  pull_request:
    paths:
      - "AlpacaCore/external/**"
      - "**/CMakeLists.txt"
      - "debian/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "dependencies/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    name: Regenerate and validate dependency inventory
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --quiet -r scripts/dependencies/requirements.txt

      - name: Validate committed inventory.json structure
        run: python3 scripts/dependencies/validate_inventory.py

      - name: Check for drift, staleness, and unacknowledged risk
        run: python3 scripts/dependencies/map_dependencies.py --check
