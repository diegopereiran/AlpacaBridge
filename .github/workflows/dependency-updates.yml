name: Dependency update status

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    name: Check upstream dependency status
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --quiet -r scripts/dependencies/requirements.txt

      # Regenerate inventory.json fresh rather than trusting the committed one,
      # so the update check reflects the branch's current vendored versions.
      - name: Regenerate inventory (non-blocking; report-only workflow)
        run: python3 scripts/dependencies/map_dependencies.py --write || true

      - name: Check for updates and update the persistent status issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dependency-artifacts
          python3 scripts/dependencies/check_updates.py --artifacts-dir dependency-artifacts

      # Downloaded vendor SDK archives are reviewed by a human, never
      # committed or auto-installed. Upload them as a short-lived build
      # artifact, then remove them from the working tree before committing
      # anything else.
      - name: Upload downloaded SDK archives for human review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: dependency-update-archives
          path: dependency-artifacts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Remove downloaded archives from the working tree
        if: always()
        run: rm -rf dependency-artifacts

      # dependencies/update-state.json is a small version/hash/checked_at
      # snapshot used to detect a vendor silently replacing an
      # already-published artifact -- never the artifact itself.
      - name: Commit updated snapshot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dependencies/update-state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(dependencies): update snapshot state"
          git push
